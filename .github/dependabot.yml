version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 20
    versioning-strategy: increase
    allow:
      - dependency-type: "all"
    groups:
      fast-forward-compatible:
        patterns:
          - "fast-forward/*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "Composer"
      include: "scope"
    labels:
      - "composer"
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "GitHub Actions"
      include: "scope"
    labels:
      - "github-actions"
      - "continuous-integration"
